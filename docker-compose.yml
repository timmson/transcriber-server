services:
  transcriber:
    build:
      context: .
    volumes:
      - "./:/app/"
    command: "python3 transcriber.py"
    # command: "./install.sh"
    # command: "chmod +x ./.venv/bin/activate && ./.venv/bin/activate && python3 diarisator.py"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
